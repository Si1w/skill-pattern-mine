[project]
name = "skill-pattern-mine"
version = "0.1.0"
description = "An empirical study of how developers fork and modify agent skills on GitHub."
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "MIT" }
dependencies = [
    "pydantic==2.13.5",
    "pyyaml==6.0.2",
    "pydriller==2.12",
    "gitpython==3.1.62",
]

[dependency-groups]
dev = []

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
