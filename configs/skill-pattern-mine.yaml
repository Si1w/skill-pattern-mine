dataset: github-public-skill-forks
seed: 42

github:
  api_version: "2026-03-10"
  per_page: 100
  max_attempts: 3
  timeout_seconds: 60

retrieval:
  topic_seeds:
    - anthropics/skills
    - obra/superpowers
    - vercel-labs/agent-skills
  topic_contains: skill
  maximum_topics: 3
  description_queries:
    - 'skill in:name,description,topics,readme'
  manifest_queries:
    - 'filename:marketplace.json path:.claude-plugin'
    - 'filename:plugin.json path:.claude-plugin'
  fork_sort: oldest

screening:
  minimum_forks: 2000
  maximum_forks_per_star: 1.0
  maximum_packages: 300
  repositories:
    - obra/superpowers
    - mattpocock/skills
